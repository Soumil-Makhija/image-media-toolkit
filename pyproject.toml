[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "imagelens-local"
version = "0.1.0"
description = "A local image library with preserved originals, editable alt text, tags and search"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Soumil Makhija"}]
dependencies = ["Pillow>=12.0.0,<14"]

[project.scripts]
imagelens = "imagelens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
