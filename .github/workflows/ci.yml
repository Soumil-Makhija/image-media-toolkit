name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Known-answer offline workflow
        run: python evals/run_offline.py --out /tmp/imagelens-offline
      - name: Installed CLI smoke
        run: |
          imagelens --help
          imagelens --library /tmp/imagelens-library add examples/images/orange-mug.png
          imagelens --library /tmp/imagelens-library search orange
          imagelens --library /tmp/imagelens-library export --out /tmp/imagelens-index.json
          imagelens --library /tmp/imagelens-library gallery --out /tmp/imagelens-gallery
